name: Agentbox
options:
  bundleIdPrefix: dev.agentbox
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: de
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
  SWIFT_STRICT_CONCURRENCY: minimal
packages:
  AgentboxKit:
    path: AgentboxKit
targets:
  Agentbox:
    type: application
    platform: iOS
    sources:
      - path: Agentbox
        excludes:
          - Info.plist
    dependencies:
      - package: AgentboxKit
      - target: AgentboxWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentbox.iphone
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Agentbox/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Agentbox
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  AgentboxWatch:
    type: application
    platform: watchOS
    sources:
      - path: AgentboxWatch
        excludes:
          - Info.plist
          - Watch.entitlements
    dependencies:
      - package: AgentboxKit
      - target: AgentboxWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentbox.iphone.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AgentboxWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentboxWatch/Watch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Agentbox
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.agentbox.iphone
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  AgentboxWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: AgentboxWatchWidget
        excludes:
          - Info.plist
          - Widget.entitlements
    dependencies:
      - package: AgentboxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentbox.iphone.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AgentboxWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentboxWatchWidget/Widget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  Agentbox:
    build:
      targets:
        Agentbox: all
        AgentboxWatch: all
        AgentboxWatchWidget: all
    run:
      config: Debug
  AgentboxWatch:
    build:
      targets:
        AgentboxWatch: all
        AgentboxWatchWidget: all
    run:
      config: Debug
